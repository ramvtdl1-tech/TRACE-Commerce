# Deploy this directory as the repository root, or select trace-commerce/render.yaml
# as the Blueprint path and set rootDir: trace-commerce on this service.
# A persistent disk requires a compatible paid Render service. No deployment is implied.
services:
  - type: web
    name: trace-commerce
    runtime: python
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn commerce.app:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /healthz
    disk:
      name: commerce-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.16
      - key: DATABASE_PATH
        value: /var/data/commerce.sqlite3
      - key: COOKIE_SECURE
        value: "true"
      - key: PAYMENT_MODE
        value: sandbox
      - key: AI_MODE
        value: provider
      - key: AI_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1
      - key: AI_MAX_TOKENS
        value: "4000"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
